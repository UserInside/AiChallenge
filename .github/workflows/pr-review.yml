name: PR Review Assistant

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR files via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e

          mkdir -p pr_data

          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$OWNER/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            > pr_data/pr_files_raw.json

          echo "Saved pr_files_raw.json"

      - name: Fetch full content of changed files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e

          jq -r '.[].filename' pr_data/pr_files_raw.json > pr_data/files.txt

          mkdir -p pr_data/files

          while read -r file; do
            echo "Fetching $file"

            curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://raw.githubusercontent.com/$REPO/$SHA/$file" \
              -o "pr_data/files/$(basename "$file")" || true

          done < pr_data/files.txt

      - name: Build RAG context
        run: |
          python3 scripts/build_rag_context.py

      - name: Generate PR review with GigaChat
        env:
          GIGACHAT_CLIENT_ID: ${{ secrets.GIGACHAT_CLIENT_ID }}
          GIGACHAT_CLIENT_SECRET: ${{ secrets.GIGACHAT_CLIENT_SECRET }}
        run: |
          python3 scripts/generate_pr_review_gigachat.py

